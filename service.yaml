# (1) ClusterIP: 클러스터 내부용. Istio VirtualService와 CoreDNS(demo-app.demo.svc.cluster.local)가 이 이름을 쓴다.
apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: demo
  labels:
    app: demo-app
spec:
  type: ClusterIP
  selector:
    app: demo-app          # v1, v2 Pod 모두 선택 (버전 구분은 Istio가 담당)
  ports:
    - name: http           # Istio가 프로토콜을 HTTP로 인식하도록 이름을 http로 지정
      port: 80
      targetPort: 8080
---
# (2) NodePort: 과제 3.1. bastion에서 curl http://<노드IP>:30080 으로 직접 접근
apiVersion: v1
kind: Service
metadata:
  name: demo-app-nodeport
  namespace: demo
  labels:
    app: demo-app
spec:
  type: NodePort
  selector:
    app: demo-app
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30080
